<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabHarmony</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 100% !important;
      min-width: 0 !important;
      height: 100vh;
    }
    .container {
      width: 100%;
      height: 100%;
      max-width: none;
      min-width: 0;
    }
    .actions-container,
    .section-header,
    .tab-item,
    .search-input {
      min-width: 0;
    }
    .tab-title {
      min-width: 0;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索标签页..." class="search-input">
        <button id="aiSearchToggle" class="ai-toggle" title="AI 语义搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
            <path d="M18 14v1a6 6 0 0 1-12 0v-1"/>
            <path d="M12 19v3"/>
          </svg>
        </button>
      </div>
      <div class="actions-container">
        <button id="toggleCollapseButton" class="action-btn icon-only" title="折叠/展开全部">
          <svg class="collapse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 8l-5 5-5-5"/>
            <path d="M17 13l-5 5-5-5"/>
          </svg>
        </button>
        <button id="organizeButton" class="action-btn icon-only" title="智能分组">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 4-1 1 4 4 1-1a2.83 2.83 0 1 0-4-4Z"/>
            <path d="m13 6-8.5 8.5a2.12 2.12 0 1 0 3 3L16 9"/>
            <path d="m2 22 5.5-1.5L9 19"/>
          </svg>
          <div class="loading-spinner hidden"></div>
        </button>
        <button id="ungroupAllButton" class="action-btn icon-only" title="取消分组">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14 4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>
          </svg>
        </button>
        <button id="newTabButton" class="action-btn icon-only" title="新建标签页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <main>
      <div id="tabGroups"></div>
    </main>

    <!-- Footer -->
    <div class="footer">
      <span id="tabCount">管理 0 个标签页</span>
      <div class="footer-actions">
        <button id="settingsButton" class="sidebar-btn" title="AI 设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="config.js" type="module"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
